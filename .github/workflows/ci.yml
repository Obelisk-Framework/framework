name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: ORM unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Run unit tests
        run: npm test
